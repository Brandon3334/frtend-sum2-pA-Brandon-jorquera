<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViajarYa - Agencia de Turismo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra de Navegación -->
    <nav class="navbar">
        <div class="logo">ViajarYa</div>
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#destinos">Destinos</a></li>
            <li><a href="#paquetes">Paquetes</a></li>
            <li><a href="#nosotros">Nosotros</a></li>
            <li><a href="reserva.html" class="btn-reservar">Reservar</a></li>
        </ul>
    </nav>

    <!-- Sección Hero -->
    <header class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Descubre el Mundo con ViajarYa</h1>
            <p>Las mejores experiencias de viaje y turismo de aventura a tu alcance.</p>
            
            <!-- Buscador Visual -->
            <div class="buscador">
                <input type="text" placeholder="¿A dónde quieres ir?">
                <input type="date">
                <input type="number" placeholder="Pasajeros" min="1">
                <a href="reserva.html" class="btn-buscar">Buscar</a>
            </div>
        </div>
    </header>

</body>
</html>

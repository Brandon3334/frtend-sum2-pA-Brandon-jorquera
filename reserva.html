<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - ViajarYa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reserva.css">
</head>
<body>
    <!-- Barra de Navegación -->
    <nav class="navbar">
        <div class="logo">ViajarYa</div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="index.html#destinos">Destinos</a></li>
            <li><a href="index.html#paquetes">Paquetes</a></li>
            <li><a href="index.html#nosotros">Nosotros</a></li>
            <li><a href="reserva.html" class="btn-reservar">Reservar</a></li>
        </ul>
    </nav>

    <main class="contenedor-formulario">
        <h1>Solicitud de Reserva</h1>
        <p>Completa el siguiente formulario para armar el viaje de tus sueños.</p>

        <form id="formularioReserva">
            
            <!-- SECCIÓN A: Datos del Viaje -->
            <fieldset>
                <legend>Sección A - Datos del Viaje</legend>
                
                <div class="grupo-campo">
                    <label for="destino">Destino de interés:</label>
                    <select id="destino" name="destino" required>
                        <option value="">Selecciona un destino...</option>
                        <optgroup label="América del Sur">
                            <option value="buenos-aires">Buenos Aires, Argentina</option>
                            <option value="machu-picchu">Machu Picchu, Perú</option>
                            <option value="rio">Río de Janeiro, Brasil</option>
                        </optgroup>
                        <optgroup label="Europa">
                            <option value="paris">París, Francia</option>
                            <option value="roma">Roma, Italia</option>
                            <option value="madrid">Madrid, España</option>
                        </optgroup>
                        <optgroup label="Asia">
                            <option value="tokio">Tokio, Japón</option>
                            <option value="bali">Bali, Indonesia</option>
                            <option value="bangkok">Bangkok, Tailandia</option>
                        </optgroup>
                        <optgroup label="Caribe">
                            <option value="cancun">Cancún, México</option>
                            <option value="punta-cana">Punta Cana, RD</option>
                        </optgroup>
                        <optgroup label="Otros">
                            <option value="sydney">Sydney, Australia</option>
                            <option value="dubai">Dubái, EAU</option>
                        </optgroup>
                    </select>
                </div>

                <div class="grupo-campo">
                    <label>Tipo de paquete:</label>
                    <div class="opciones-radio">
                        <label><input type="radio" name="tipo_paquete" value="todo-incluido" required> Todo incluido</label>
                        <label><input type="radio" name="tipo_paquete" value="vuelo-hotel"> Solo aéreo más hotel</label>
                        <label><input type="radio" name="tipo_paquete" value="crucero"> Crucero</label>
                        <label><input type="radio" name="tipo_paquete" value="egresados"> Viaje de egresados</label>
                        <label><input type="radio" name="tipo_paquete" value="a-medida"> A medida</label>
                    </div>
                </div>

                <div class="grupo-campo doble">
                    <div>
                        <label for="fecha_salida">Fecha de salida deseada:</label>
                        <input type="date" id="fecha_salida" name="fecha_salida" required>
                    </div>
                    <div>
                        <label for="fecha_regreso">Fecha de regreso deseada:</label>
                        <input type="date" id="fecha_regreso" name="fecha_regreso" required>
                    </div>
                </div>

                <div class="grupo-campo checkbox-inline">
                    <input type="checkbox" id="flexibilidad" name="flexibilidad">
                    <label for="flexibilidad">Mis fechas son flexibles (más o menos 3 días)</label>
                </div>

                <div class="grupo-campo">
                    <label for="duracion">Duración aproximada:</label>
                    <select id="duracion" name="duracion">
                        <option value="3-5">3 a 5 días</option>
                        <option value="1-sem">1 semana</option>
                        <option value="2-sem">2 semanas</option>
                        <option value="mas-2-sem">Más de 2 semanas</option>
                    </select>
                </div>

                <div class="grupo-campo">
                    <label for="puerto_salida">Puerto de salida preferido:</label>
                    <select id="puerto_salida" name="puerto_salida">
                        <option value="buenos-aires">Buenos Aires</option>
                        <option value="cordoba">Córdoba</option>
                        <option value="rosario">Rosario</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                
                <!-- Este campo se mostrará con JS más adelante (Etapa 3) si eligen "Otro" -->
                <div class="grupo-campo oculto" id="caja_otro_puerto">
                    <label for="otro_puerto">Especificar ciudad de salida:</label>
                    <input type="text" id="otro_puerto" name="otro_puerto" placeholder="Ej: Mendoza">
                </div>

            </fieldset>

            <!-- SECCIÓN B: Datos de los Pasajeros -->
            <fieldset>
                <legend>Sección B - Datos de los Pasajeros</legend>
                <div class="grupo-campo doble">
                    <div>
                        <label for="adultos">Cantidad de adultos (Min 1, Max 10):</label>
                        <input type="number" id="adultos" name="adultos" min="1" max="10" value="1" required>
                    </div>
                    <div>
                        <label for="menores">Cantidad de menores (Min 0, Max 8):</label>
                        <input type="number" id="menores" name="menores" min="0" max="8" value="0">
                    </div>
                </div>
            </fieldset>

        </form>
    </main>

    <!-- Footer replicado para mantener diseño -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 ViajarYa - Agencia de Turismo. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
